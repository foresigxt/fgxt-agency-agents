name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ["v*"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      # dist/ is committed; fail if the build produced anything different.
      # This is what makes git-install distribution safe: consumers install the
      # repo at a tag and get the committed dist/ verbatim (no build on install).
      - name: Ensure committed dist/ is up to date
        run: git diff --exit-code -- dist
